name: Pull request quality gates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, build, and Gemini smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build -- --webpack

      - name: Verify Gemini API key
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_API_KEY:-}" || { echo "GOOGLE_API_KEY is not configured"; exit 1; }

          http_code=$(curl --silent --show-error \
            --output /tmp/gemini-response.json \
            --write-out '%{http_code}' \
            --request POST \
            'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent' \
            --header 'Content-Type: application/json' \
            --header "x-goog-api-key: ${GOOGLE_API_KEY}" \
            --data '{"contents":[{"parts":[{"text":"Reply exactly GOOGLE_API_OK"}]}],"generationConfig":{"maxOutputTokens":20,"temperature":0}}')

          if [ "$http_code" != "200" ]; then
            echo "Gemini API returned HTTP ${http_code}"
            jq -c '{error: .error}' /tmp/gemini-response.json || true
            exit 1
          fi

          text=$(jq -r '.candidates[0].content.parts[0].text // ""' /tmp/gemini-response.json | tr -d '\r\n')
          if [ "$text" != "GOOGLE_API_OK" ]; then
            echo "Gemini API authenticated but returned an unexpected response"
            exit 1
          fi

          echo "GOOGLE_API_KEY verified successfully against gemini-3.6-flash"
